[project]
name = "dtai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch==2.12.0+cpu",
    "torchvision==0.27.0+cpu",
    "flask>=3.0.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "gunicorn>=22.0.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
