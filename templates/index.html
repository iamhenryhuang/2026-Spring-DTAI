<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plant Disease Classifier</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}" />
</head>
<body>
<div class="page">

  <div class="hd">
    <div class="hd-left">
      <div class="hd-eyebrow">
        <div class="hd-icon">
          <svg viewBox="0 0 24 24">
            <path d="M5 21c8 0 14-6 14-14V3h-4C8 3 3 8 3 15v1"/>
            <path d="M3 21c4-6 8-9 14-12"/>
          </svg>
        </div>
        <span class="hd-eyebrow-text">植物病害診斷</span>
      </div>
      <h1 class="hd-title">Plant Disease Classifier</h1>
      <p class="hd-desc">上傳葉片影像，取得 AI 模型診斷結果與信心分析</p>
    </div>
    <div class="hd-status" id="hd-status">
      <div class="hd-status-dot"></div>
      <span id="hd-label">等待上傳</span>
    </div>
  </div>

  <div class="grid">

    <!-- Col 1: Upload / Preview -->
    <div class="card upload-card">
      <div class="card-hd">
        <div class="card-title">
          <div class="card-title-icon">
            <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8 12 3 7 8"/><path d="M12 3v12"/></svg>
          </div>
          影像上傳
        </div>
        <div class="card-badge" id="spinner">
          <div class="spin"></div>
          推論中
        </div>
      </div>

      <div class="dz-wrap" id="dz-wrap">
        <div class="dz" id="drop-zone">
          <input type="file" id="file-input" accept="image/*" aria-label="選擇葉片影像" />
          <div class="dz-content">
            <div class="dz-circle">
              <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8 12 3 7 8"/><path d="M12 3v12"/></svg>
            </div>
            <p class="dz-primary">拖曳或點擊以上傳</p>
            <p class="dz-secondary">選擇一張清晰的植物葉片照片</p>
            <div class="dz-tags">
              <span class="dtag">JPG</span>
              <span class="dtag">PNG</span>
              <span class="dtag">WEBP</span>
              <span class="dtag">BMP</span>
            </div>
          </div>
        </div>
      </div>

      <div class="preview-wrap" id="preview-wrap">
        <div class="preview-img-box">
          <img id="preview-img" src="" alt="預覽影像" />
        </div>
        <div id="error-msg" role="alert"><span id="error-text"></span></div>
        <div class="preview-footer">
          <div class="pf-name"><strong id="file-name"></strong></div>
          <div class="pf-actions">
            <button class="btn btn-soft" id="reset-btn">
              <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
              重新選擇
            </button>
            <button class="btn btn-green" id="analyze-btn">
              <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
              開始辨識
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Col 2: Results -->
    <div class="card res-card">
      <div class="card-hd">
        <div class="card-title">
          <div class="card-title-icon">
            <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          </div>
          診斷結果
        </div>
      </div>

      <div id="verdict">
        <div class="v-tag-row">
          <div class="v-tag" id="v-tag"><div class="v-tag-dot"></div><span id="v-tag-label"></span></div>
          <div class="v-warn" id="v-warn">信心偏低，建議補拍清晰影像確認</div>
        </div>
        <div class="v-name" id="v-name"></div>
        <div class="v-zh"   id="v-zh"></div>
        <div class="v-bar-wrap">
          <div class="v-bar"><div class="v-bar-fill" id="v-bar-fill"></div></div>
          <div class="v-pct" id="v-pct"></div>
        </div>
      </div>

      <div class="res-list-wrap">
        <div class="col-empty" id="empty">
          <div class="col-empty-icon">
            <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          </div>
          <p>上傳影像並執行辨識<br>即可在此查看結果</p>
        </div>
        <div id="results-list"></div>
      </div>
    </div>

    <!-- Col 3: Advice -->
    <div class="card advice-col" id="advice-col">
      <div class="card-hd">
        <div class="card-title">
          <div class="card-title-icon">
            <svg viewBox="0 0 24 24"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          </div>
          <span id="advice-title">LLM 照護建議</span>
        </div>
        <div style="display:flex;align-items:center;gap:6px;margin-right:8px;flex-shrink:0;">
          <label for="provider-select" style="font-size:0.78rem;color:var(--n-500);white-space:nowrap;">模型</label>
          <select id="provider-select" style="font-size:0.78rem;padding:2px 6px;border:1px solid var(--n-200);border-radius:6px;background:var(--n-0);color:var(--n-700);cursor:pointer;">
            <option value="groq">Groq / Llama 3.3</option>
            <option value="huggingface">HuggingFace / Qwen 2.5</option>
          </select>
          <button class="btn btn-soft" id="regen-btn" style="display:none;height:26px;padding:0 10px;font-size:0.72rem;">重新產生</button>
        </div>
        <div class="card-badge" id="advice-status">
          <div class="spin"></div>
          產生中
        </div>
      </div>

      <div class="advice-body-wrap">
        <div class="col-empty" id="advice-empty">
          <div class="col-empty-icon">
            <svg viewBox="0 0 24 24"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          </div>
          <p>辨識完成後<br>將自動產生照護建議</p>
        </div>
        <div id="advice-body" style="display:none"></div>
        <div class="advice-note" id="advice-note" style="display:none">此內容由 AI 依模型結果產生，實際處理仍建議搭配現場觀察與專業判斷。</div>
      </div>
    </div>

  </div>
</div>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
